name: Generate arcade animation

on:
  schedule:
    # FIX: Mengubah '* */12 * * *' menjadi '0 */12 * * *' 
    # Karena kalau pakai tanda bintang di depan, bot-nya bakal jalan TIAP MENIT selama 12 jam (bisa di-banned GitHub!)
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Langkah wajib buat ngintip repositori lu
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: patihpyyt
          games: 'pacman'

      # FIX: Memastikan robot nge-push file SVG Pacman yang bener ke branch output
      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: github-contribution-wall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
