name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Konfigurasi khusus untuk mengubah ular menjadi Pacman & Hantu
      - name: generate github-contribution-grid-snake.gif
        uses: Platane/snk@v3
        with:
          github_user_name: patihpyyt
          outputs: |
            dist/github-contribution-grid-snake.gif?color_snake=%23fdbd10&color_dots=%23ebedf0,%237bc96f,%23239a3b,%23196127&palette=github-dark
            dist/github-contribution-grid-snake-dark.gif?color_snake=%23fdbd10&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353&palette=github-dark
            
      - name: push github-contribution-grid-snake.gif to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
